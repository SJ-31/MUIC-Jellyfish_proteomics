session_name: "workflow results"
start_directory: "./"
environment:
  bin: "./bin"
  config: "./config"
  results: "./results"
  data: "./data"
  tests: "./tests"
  nf_test: "./tests/nf-test-out"
windows:
  - window_name: results
    start_directory: ./results
    panes:
      - "yazi"
  - window_name: "figures"
    layout: even-horizontal
    start_directory: ./docs/figures
    panes:
      - "yazi"
  - window_name: "qseqs"
    start_directory: ./docs/figures/query_seqs/
  - window_name: "reference"
    start_directory: ./data/reference
    panes:
      - "yazi"
