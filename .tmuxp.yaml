session_name: "workflow"
start_directory: "./"
shell_command_before:
  - cmd: source ~/.venv/default/bin/activate
environment:
  bin: "./bin"
  wd: "."
  config: "./config"
  results: "./results"
  data: "./data"
  tests: "./tests"
  nf_test: "./tests/nf-test-out"
windows:
  - window_name: "main"
    panes:
      - "tmuxp load -d ./tmuxp_results.yaml"
  - window_name: results
    start_directory: ./results
    panes:
      - "yazi"
  - window_name: "git"
    panes:
      - "gitui"
  - window_name: "pytest"
    start_directory: ./tests/pytest
